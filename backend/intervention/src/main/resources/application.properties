spring.application.name=intervention
# ===================================================================
# CONFIGURATION DE LA BASE DE DONNEES (MySQL / XAMPP)
# ===================================================================
# 3306 howa l-port l-défaul dyal MySQL f XAMPP. 
# gestion_interventions hiya ssmyt l-base de données li ghadi tcreya.
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_interventions?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURATION DE HIBERNATE / JPA
# ===================================================================
# 'update' kat-khlli Hibernate y-créer les tables automatic mlli kayلقاهمش
spring.jpa.hibernate.ddl-auto=update

# Kay-biyn lik les requêtes SQL li kay-exécutihom Hibernate f l-terminal (zwinna l t-test)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# l-Dialect s-s7i7 l MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Permettre à Hibernate de créer les tables d'abord, puis exécuter data.sql après
spring.jpa.defer-datasource-initialization=true

# Forcer l'exécution de data.sql à chaque démarrage
spring.sql.init.mode=always

# ===================================================================
# CONFIGURATION EMAIL (Gmail SMTP)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=salmaboussami82@gmail.com
spring.mail.password=kjlejenvbpvuasia
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Durée de validité du code OTP en minutes
app.verification.code.expiry-minutes=10

# Debug Spring Security
logging.level.org.springframework.security=DEBUG

# Clé JWT stable pour éviter d'invalider les tokens à chaque redémarrage
app.jwt.secret=ocp-intervention-jwt-secret-key-2026-change-me-to-a-stronger-secret


